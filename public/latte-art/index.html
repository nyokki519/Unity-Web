<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#292018">
  <title>チョコペン・ラテアート｜Unity MIX</title>
  <link rel="stylesheet" href="./style.css?v=6">
</head>
<body>
  <main id="studio">
    <canvas id="scene" aria-label="カップのミルクフォームに指でチョコを描く"></canvas>
    <canvas id="fallback" aria-hidden="true" hidden></canvas>
    <div id="hud" class="hud">
      <a class="brand" href="/" aria-label="Unity MIX ホーム"><b>UNITY</b> MIX</a>
      <button id="menuButton" class="round menu-button" type="button" aria-expanded="false" aria-controls="menu" aria-label="メニュー">☰</button>
      <nav id="menu" class="menu glass" hidden aria-label="ラテアートのメニュー">
        <button type="button" id="showHelp">遊び方</button>
        <button type="button" id="showPour">ミルクを注ぐ</button>
        <button type="button" id="showDraw">チョコペンで描く</button>
        <a href="/">Unity MIX ホーム</a>
      </nav>
      <p id="tip" class="hint">泡に触れて一滴。指を動かして一筆。</p>
      <section id="pourControls" class="glass pour-controls" aria-label="注ぎ方を試す" hidden>
        <label for="tilt">注ぐ量</label>
        <input id="tilt" type="range" min="0" max="100" value="0">
        <output for="tilt" id="tiltValue">0%</output>
        <button id="resetPour" type="button">注ぎ直す</button>
      </section>
      <div id="bar" class="bar glass" role="group" aria-label="ラテアートの操作">
        <div id="drawControls" class="control-group">
          <button id="widthButton" type="button" class="pen-button on" aria-expanded="false" aria-controls="widthPanel"><i aria-hidden="true"></i> 太さ</button>
          <button id="undo" type="button" disabled>戻す</button>
          <button id="clear" type="button" disabled>全消し</button>
          <button id="finish" class="go" type="button">完成</button>
        </div>
        <button id="next" class="go" type="button" hidden>チョコペンで描く</button>
      </div>
      <div id="widthPanel" class="glass width-panel" hidden>
        <label for="width">チョコペンの太さ</label>
        <input id="width" type="range" min="1" max="9" value="4">
      </div>
      <span id="status" class="sr-only" role="status" aria-live="polite"></span>
    </div>
    <button id="serving" class="serve-overlay" type="button" hidden aria-label="完成写真へ進む"><span>お待たせしました</span></button>
    <dialog id="finishPanel" class="shot" aria-labelledby="resultTitle">
      <div class="result">
        <button id="closeResult" class="round shot-x" type="button" aria-label="編集に戻る">×</button>
        <div id="resultPhoto" class="result-photo" aria-busy="true">
          <span id="photoLabel">画像を準備中…</span>
          <img id="preview" alt="完成したラテアート" hidden>
        </div>
        <div class="result-info">
          <h1 id="resultTitle">できあがり</h1>
          <div class="result-actions">
            <button id="saveImage" class="primary" type="button">画像を保存</button>
            <button id="editAgain" class="go" type="button">編集に戻る</button>
          </div>
          <button id="restart" class="new-cup" type="button">新しい一杯</button>
          <p id="saveStatus" role="status"></p>
        </div>
      </div>
    </dialog>
    <dialog id="clearDialog" class="sheet">
      <h2>チョコの線をすべて消しますか？</h2>
      <form method="dialog">
        <button value="cancel" autofocus>キャンセル</button>
        <button value="clear" class="go">全消し</button>
      </form>
    </dialog>
    <dialog id="helpDialog" class="sheet">
      <h2>チョコペンの使い方</h2>
      <p>ピッチャーでミルクフォームを注いだら、チョコペンの先を泡に近づけて描きます。点は軽く触れ、ひげや輪郭は指をすべらせてみましょう。</p>
      <p>太さを変えたり、一筆ずつ戻したりできます。実際のチョコは温度と粘度で線幅が変わります。</p>
      <form method="dialog"><button class="go">描く画面へ</button></form>
    </dialog>
  </main>
  <script type="module" src="./app.js?v=6"></script>
</body>
</html>
