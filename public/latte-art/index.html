<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#684b36"><title>ラテアート注ぎました｜Unity MIX</title><link rel="stylesheet" href="./style.css?v=3"></head><body>
<main class="demo"><header><a href="/">← Unity MIX</a><h1>ラテアートの手ほどき</h1><button id="sound" aria-pressed="false">音 OFF</button></header><div class="stage-label"><span id="stageName">01 · ミルクを注ぐ</span><button id="helpToggle" aria-expanded="false">この工程の説明</button></div><section class="viewport" id="viewport"><canvas id="scene" aria-label="木のテーブルに置いたカップとミルクピッチャー"></canvas><div id="drawingLayer" hidden><canvas id="art" aria-label="ラテ表面にチョコペンで描く"></canvas></div><div class="pour-controls" id="pourControls"><label for="tilt">ピッチャーを傾けて注ぐ</label><input id="tilt" type="range" min="0" max="100" value="0" orient="vertical"><output id="tiltValue">止</output><small>上へ動かすと注ぎます</small><button id="resetPour">注ぎ直す</button></div><div class="draw-controls" id="drawControls" hidden><p>チョコペンで表面をなぞる</p><div class="draw-tools"><button class="color active" data-color="#58331f">●</button><button class="color" data-color="#a15e37">●</button><label>太さ<input id="width" type="range" min="3" max="15" value="7"></label><button id="undo">戻す</button><button id="clear">消す</button></div></div><div id="lesson" class="lesson"><span>TIP</span><button id="closeHelp" aria-label="説明を閉じる">×</button><h2 id="lessonTitle">まずはミルクを注いでみましょう</h2><p id="lessonText">左のレバーを上げて注ぎ、画面をなぞって注ぐ位置を動かします。表面の色が変わる様子を見てみましょう。</p></div><button id="next" class="next" hidden>チョコペンで描く →</button><button id="finish" class="next" hidden>仕上がりを見る →</button><button id="restart" class="next" hidden>最初からやり直す ↻</button></section><footer><span id="status">注ぐ量 0% · 表面をドラッグして位置を移動</span><button id="motion" aria-pressed="false">動きを抑える</button></footer></main><script type="module" src="./app.js?v=3"></script></body></html>
